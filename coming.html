<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankur Gupta | Thinker • Creator • Builder</title>
    <meta name="description" content="One Mind • Many Universes. Ideas that move minds. Outcomes that move markets. Since 1980.">
    <link rel="icon" type="image/png" href="assets/proman_logo.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #080808;
            --accent-blue: #1A6AFF;
            --text-primary: #FFFFFF;
            --text-secondary: #9E9E9E;
            --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at 50% 35%, rgba(26, 106, 255, 0.15) 0%, rgba(8, 8, 8, 1) 75%);
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 30px 24px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-home {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .btn-home:hover {
            color: #FFFFFF;
            border-color: var(--accent-blue);
        }

        main {
            text-align: center;
            padding: 60px 24px;
        }

        .avatar-wrap img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(26, 106, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 16px;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .subhead {
            font-size: 20px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .quote {
            font-size: 17px;
            color: #D1D1D1;
            max-width: 520px;
            margin: 0 auto 36px;
            line-height: 1.6;
        }

        .status-box {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00E676;
            box-shadow: 0 0 10px #00E676;
        }

        footer {
            padding: 30px 24px;
            text-align: center;
            font-size: 13px;
            color: #555555;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <span style="font-weight: 700; letter-spacing: 1px; font-size: 14px;">ANKUR GUPTA</span>
            <a href="/" class="btn-home">&larr; Proman 2.0</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="avatar-wrap">
                <img src="assets/ankur_profile.jpg" alt="Ankur Gupta">
            </div>
            <div class="badge">ONE MIND • MANY UNIVERSES</div>
            <h1>Ankur Gupta</h1>
            <div class="subhead">Thinker • Creator • Builder</div>
            <div class="quote">
                "Ideas that move minds.<br>Outcomes that move markets.<br>Since 1980."
            </div>
            <div>
                <div class="status-box">
                    <span class="status-dot"></span>
                    <span>Personal ventures launching soon</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            &copy; 2025 by Ankur Gupta. All rights reserved.
        </div>
    </footer>

</body>
</html>
